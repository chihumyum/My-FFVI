<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><title>FINAL FANTASY VI · Web</title
  ><link rel="stylesheet" href="./style.css" />
  <body class="game">
    <div id="boot-status" role="status" aria-live="polite">
      <div class="load-card">
        <p id="boot-message">正在加载游戏资源…</p>
        <progress id="load-progress" aria-label="当前场景加载进度"></progress>
        <p id="load-detail">准备资源…</p>
        <button id="load-retry" hidden>重试</button>
        <a id="load-reload" href="">重新加载</a>
      </div>
    </div>
    <main>
      <canvas id="screen" width="320" height="180"></canvas>
      <section id="title">
        <h1>FINAL FANTASY VI</h1>
        <p>Web 移植</p>
        <button id="new">新游戏</button><button id="load">继续游戏</button>
        <button id="extras-open">额外内容</button>
      </section>
      <section id="dialogue" hidden>
        <strong id="speaker"></strong>
        <div id="message"></div>
        <div id="choices"></div>
        <button id="confirm">继续 ▸</button>
      </section>
      <section id="battle" hidden>
        <div id="battle-status"></div>
        <div id="commands"></div>
        <div id="targets"></div>
        <button id="escape">逃跑</button>
      </section>
      <section id="battle-action" hidden><strong id="battle-action-name"></strong></section>
      <aside id="battle-result" hidden>
        <h2>战斗胜利</h2>
        <p id="battle-reward-summary"></p>
        <div id="battle-reward-members"></div>
        <p id="battle-reward-items"></p>
        <button id="battle-result-confirm">继续（空格 / Enter）</button>
      </aside>
      <footer>
        <span id="mode" hidden>剧情测试 · 强化队伍</span
        ><span id="location">方向键 / WASD 移动 · Enter / 空格确认 · Esc 菜单 · Q 换队</span
        ><button id="walk">自动行走：关</button><button id="switch" hidden>切换队伍（Q）</button
        ><button id="auto">自动推进：关</button><button id="vehicle-open" hidden>载具操作</button>
        <button id="test">剧情测试（强化队伍）</button><button id="loadtest">继续剧情测试</button>
        <button id="bug-report">报告问题（F9）</button>
        <span id="bug-status" role="status" aria-live="polite"></span>
      </footer>
      <aside id="over" hidden>
        <h2>任务失败</h2>
        <p id="over-message"></p>
        <button id="retry">读取存档</button
        ><button id="retrytest" hidden>强化重试（剧情测试）</button>
      </aside>
      <aside id="shop" hidden>
        <h2>商店</h2>
        <p id="shop-gil"></p>
        <div id="shop-stock"></div>
        <button id="shop-close">离开</button>
      </aside>
      <aside id="colosseum" hidden>
        <h2>斗技场</h2>
        <p id="colosseum-prompt"></p>
        <div id="colosseum-choices"></div>
        <button id="colosseum-cancel">取消</button>
      </aside>
      <aside id="formation" hidden>
        <h2>编组队伍</h2>
        <div id="formation-slots"></div>
        <p id="formation-problems" role="status"></p>
        <button id="formation-confirm">确认队伍</button><button id="formation-cancel">取消</button>
      </aside>
      <aside id="vehicle" hidden>
        <h2>载具操作</h2>
        <div id="vehicle-actions"></div>
        <button id="vehicle-close">返回游戏</button>
      </aside>
      <aside id="menu" hidden>
        <h2>队伍</h2>
        <div id="menu-nav"></div>
        <div id="party"></div>
        <div id="items"></div>
        <button id="menu-save" hidden>存档</button><button id="close">返回游戏</button>
      </aside>
      <aside id="save" hidden>
        <h2 id="save-heading">存档</h2>
        <p id="save-status"></p>
        <div id="save-slots"></div>
        <button id="save-close">返回</button>
      </aside>
      <aside id="naming" hidden>
        <h2>请输入名字</h2>
        <div id="name-portrait"></div>
        <input id="name-value" aria-label="角色名字" />
        <div id="name-keys"></div>
        <button id="name-confirm">确定</button><button id="name-default">默认名字</button>
      </aside>
      <aside id="extras" hidden>
        <h2>额外内容</h2>
        <div id="extras-nav"></div>
        <p id="extras-status" role="status"></p>
        <div id="extras-body"></div>
        <button id="extras-close">返回</button>
      </aside>
    </main>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
