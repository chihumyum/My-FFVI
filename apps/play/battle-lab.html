<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>FFVI 战斗指令操作测试</title
  ><link rel="stylesheet" href="/game/style.css" />
  <script type="importmap">
    { "imports": { "pixi.js": "/vendor/pixi.mjs" } }
  </script>
  <body class="game">
    <main>
      <header>
        <h1>战斗指令操作测试</h1>
        <p>PR 实际阵型和动作 · 测试队伍强化属性 · 不读取或修改剧情存档</p>
        <label
          >角色
          <select id="actor"></select></label
        ><label
          >饰品指令
          <select id="relic">
            <option value="0">原指令</option>
            <option value="10">偷盗 → 夺取</option>
            <option value="1">攻击 → 跳跃</option>
            <option value="18">素描 → 操纵</option>
            <option value="20">老虎机 → 扔钱</option>
            <option value="7">魔法 → 连续魔</option>
          </select></label
        ><label
          >阵型
          <select id="formation">
            <option value="451">究极武器（Boss）</option>
            <option value="4">卫兵（普通战斗）</option>
          </select></label
        ><button id="restart">开始测试战斗</button><button id="cycle">切换就绪角色（Tab）</button
        ><a href="/game/">返回游戏</a>
        <div id="gogo-commands" hidden></div>
      </header>
      <canvas id="screen" width="320" height="180"></canvas>
      <section id="battle">
        <div id="battle-status"></div>
        <div id="commands"></div>
        <div id="targets"></div>
      </section>
      <footer id="result" role="status"></footer>
      <details open>
        <summary>本场战斗日志</summary>
        <pre id="action-log"></pre>
      </details>
    </main>
    <script type="module" src="/game/battle-lab.js"></script>
  </body>
</html>
