<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FFVI Web</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="/game/equipment.css" />
  </head>
  <body>
    <header>
      <span class="brand">FINAL FANTASY VI <small>WEB</small></span
      ><span
        ><span id="map-label">纳尔谢</span>
        <span class="muted">/ 开发预览</span></span
      ><span
        ><button id="sound-button" aria-pressed="true">声音开</button>
        <button
          id="map-button"
          disabled
          aria-expanded="false"
          aria-controls="map-overview"
        >
          地图
        </button>
        <button id="menu-button" disabled>暂停</button></span
      >
    </header>
    <main>
      <div id="stage">
        <canvas
          id="game"
          width="512"
          height="288"
          tabindex="0"
          aria-label="纳尔谢游戏画面。方向键移动，空格确认，Escape 暂停。"
        ></canvas>
        <button
          id="minimap-button"
          title="展开地图（M）"
          aria-label="展开地图"
          hidden
        >
          <canvas
            id="minimap"
            width="192"
            height="128"
            aria-label="当前位置与地图标记"
          ></canvas>
        </button>
        <section id="map-overview" class="overlay" aria-label="地图总览" hidden>
          <div class="map-panel">
            <div class="map-heading">
              <span id="overview-title"></span
              ><button id="close-map">返回游戏 · M / Esc</button>
            </div>
            <canvas
              id="overview"
              width="768"
              height="432"
              aria-label="地图与当前位置"
            ></canvas>
            <p class="muted">红色箭头：当前位置 · 图标：出入口与商店</p>
          </div>
        </section>
        <section id="welcome" class="overlay">
          <div class="panel">
            <span class="eyebrow">FINAL FANTASY VI</span>
            <h1 id="welcome-title">纳尔谢</h1>
            <p id="welcome-description">踏入雪中的矿镇。</p>
            <p id="welcome-scope" class="muted">
              当前开放开场行军后的短片段：探索矿镇、与守卫交战，再继续前行。首战规则和表现仍在迁移中。
            </p>
            <button id="start" disabled>正在载入…</button>
            <button id="load-start" hidden>继续上次进度</button>
            <p id="save-info" role="status"></p>
            <p id="load-error" role="alert" hidden></p>
          </div>
        </section>
        <section id="pause" class="overlay" hidden>
          <div class="panel">
            <h2>已暂停</h2>
            <button id="resume">继续</button
            ><button id="restart">重新开始此片段</button>
            <div class="battle-settings">
              <label for="battle-mode">战斗模式</label>
              <select id="battle-mode" aria-describedby="battle-mode-help">
                <option value="active">即时</option>
                <option value="wait">等待</option>
              </select>
              <p id="battle-mode-help">等待模式下，选择技能、道具和目标时暂停 ATB。</p>
              <label for="battle-speed">战斗速度</label>
              <select id="battle-speed" aria-describedby="battle-speed-help">
                <option value="0">最慢</option>
                <option value="1">较慢</option>
                <option value="2" selected>标准</option>
                <option value="3">较快</option>
                <option value="4">最快</option>
              </select>
              <p id="battle-speed-help">调整行动条、蓄力和周期状态的速度。</p>
            </div>
            <section id="owned-state" aria-label="队伍与库存">
              <div>
                <h3>队伍</h3>
                <p id="owned-party"></p>
                <p id="owned-gil"></p>
              </div>
              <div>
                <h3>道具</h3>
                <div id="owned-items"></div>
                <h3>重要物品</h3>
                <p id="owned-key-items"></p>
              </div>
            </section>
            <div id="item-targets" hidden></div>
            <p id="item-status" role="status"></p>
            <details>
              <summary>装备</summary>
              <section id="equipment-menu" aria-label="装备菜单"></section>
            </details>
            <div class="save-controls">
              <button id="save-game">保存进度</button>
              <button id="load-game" disabled>读取进度</button>
              <button id="load-previous" disabled>读取上一份</button>
            </div>
            <p id="save-status" role="status"></p>
            <details>
              <summary>当前迁移范围</summary>
              <ul id="limitations"></ul>
            </details>
          </div>
        </section>
        <section
          id="shop-menu"
          class="overlay"
          hidden
          aria-label="商店"
        ></section>
        <section id="dialogue" aria-live="polite" hidden>
          <strong id="speaker"></strong>
          <p id="message"></p>
          <button id="next" aria-label="继续对话">继续 ▾</button>
        </section>
        <section id="battle-ui" hidden aria-label="战斗操作">
          <p id="battle-action" role="status"></p>
          <div id="battle-menu"></div>
          <div id="party" aria-label="队伍"></div>
        </section>
        <section id="battle-result" class="overlay" hidden>
          <div class="panel">
            <h2 id="battle-result-title"></h2>
            <p id="battle-result-text"></p>
            <p id="battle-levels"></p>
            <button id="battle-return">继续前行</button
            ><button id="battle-retry">重试战斗</button>
          </div>
        </section>
        <section id="stop" class="overlay" hidden>
          <div class="panel">
            <h2 id="stop-title">片段结束</h2>
            <p id="stop-message"></p>
            <button id="retry">重新开始</button>
            <details>
              <summary>事件位置</summary>
              <code id="stop-source"></code>
            </details>
          </div>
        </section>
      </div>
      <footer>
        <span>方向键 / WASD 移动</span><span>空格 / Enter 确认</span
        ><span>M 地图 · Esc 暂停</span><a href="/">查看迁移工作台</a>
      </footer>
      <p id="status" class="muted" aria-live="polite">正在载入地图与角色…</p>
      <p id="music-status" class="muted"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
